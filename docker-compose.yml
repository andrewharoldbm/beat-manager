services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: beats
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: beats
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beats"]
      interval: 10s
      retries: 10

  scanner:
    build: .
    restart: always
    command: python -m app.scanner.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://beats:${DB_PASSWORD}@db:5432/beats
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    restart: always
    command: python -m app.bot.bot
    env_file: .env
    environment:
      DATABASE_URL: postgresql://beats:${DB_PASSWORD}@db:5432/beats
    volumes:
      - ./data/beats:/data/beats
      - secrets:/data/secrets
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: .
    restart: always
    command: python -m app.pipeline.scheduler
    env_file: .env
    environment:
      DATABASE_URL: postgresql://beats:${DB_PASSWORD}@db:5432/beats
      NUMBA_CACHE_DIR: /tmp
    volumes:
      - ./data/beats:/data/beats
      - secrets:/data/secrets
      - renders:/data/renders
      - visuals:/data/visuals
    depends_on:
      db:
        condition: service_healthy

  mailer:
    build: .
    restart: always
    command: python -m app.email.mailer
    env_file: .env
    environment:
      DATABASE_URL: postgresql://beats:${DB_PASSWORD}@db:5432/beats
    volumes:
      - ./data/beats:/data/beats
      - secrets:/data/secrets
      - renders:/data/renders
    depends_on:
      db:
        condition: service_healthy

  maint:
    build: .
    restart: always
    command: python -m app.maint.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://beats:${DB_PASSWORD}@db:5432/beats
    volumes:
      - secrets:/data/secrets
    depends_on:
      db:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    restart: always
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./data/backups:/backups
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    restart: always
    command: uvicorn app.web.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'
    env_file: .env
    environment:
      DATABASE_URL: postgresql://beats:${DB_PASSWORD}@db:5432/beats
    volumes:
      - ./data/beats:/data/beats
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-155-133-197-189.sslip.io}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web

volumes:
  caddy_data:
  secrets:
  renders:
  visuals:
